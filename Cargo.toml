[package]
version = "0.2.0"
name = "olivmath-ultraplonk-zk-verify"
authors = ["Lucas Bispo de Oliveira <olivmath@protonmail.com>"]
repository = "https://github.com/olivmath/olivmath-ultraplonk-zk-verify.git"
keywords = ["cryptography", "elliptic-curves", "zkverify", "ultraplonk"]
categories = ["cryptography"]
include = ["Cargo.toml", "src", "README.md", "LICENSE"]
description = "I have developed a **functional Proof of Concept (PoC/MVP)** that performs this conversion **natively in node.js (Backend) and in the browser (Frontend)**, allowing proofs to be submitted directly to ZKVerify without manual CLI steps."
license = "MIT"
edition = "2021"

[dependencies]
ark-models-ext = { git = "https://github.com/zkVerify/accelerated-bn-cryptography.git", default-features = false, tag = "v0.6.0" }
ark-bn254-ext = { git = "https://github.com/zkVerify/accelerated-bn-cryptography.git", default-features = false, tag = "v0.6.0" }
hex = { version = "0.4.3", default-features = false, features = ["alloc"], optional = true }
hex-literal = { version = "0.4.1", default-features = false }
ark-bn254 = { version = "0.5.0", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
sha3 = { version = "0.10.8", default-features = false }
snafu = { version = "0.8.3", default-features = false }

# Dependencies for noir-cli:
anyhow = { version = "1.0.86", default-features = false, optional = true }
clap = { version = "4.5.4", features = ["derive"], optional = true }
regex = { version = "1", default-features = false, optional = true }
env_logger = { version = "0.11.6", optional = true }
log = { version = "0.4.25", optional = true }

# js
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }


[dev-dependencies]
rstest = { version = "0.19.0", default-features = false }
pretty_assertions = "1.4.1"
assert_cmd = "2.0.16"
predicates = "3.1.3"
assert_fs = "1.1.2"

[[bin]]
name = "noir-cli"
path = "src/bin/noir_cli/main.rs"
required-features = ["bins"]

[features]
default = ["std", "bins"]
std = []
bins = [
    "dep:clap",
    "dep:hex",
    "dep:anyhow",
    "dep:regex",
    "dep:log",
    "dep:env_logger",
]
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]


[lib]
crate-type = ["cdylib", "rlib"]
